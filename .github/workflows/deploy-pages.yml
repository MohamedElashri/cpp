name: Deploy Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # sanad: ref=v3
        with:
          hugo-version: '0.156.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # sanad: ref=v7.0.0
        with:
          python-version: '3.12'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # sanad: ref=v6.0.0

      - name: Generate reference map
        run: python3 tools/build_reference_map.py

      - name: Generate ranges index
        run: python3 tools/ranges_categorizer.py --out data/ranges_index.json

      - name: Generate algorithm index
        run: python3 tools/algorithm_categorizer.py --out data/algorithm_index.json

      - name: Generate search index
        run: python3 tools/build_search_index.py

      - name: Build site
        run: hugo --minify --baseURL "https://melashri.net/cpp/"

      - name: Fix subpath links in built HTML
        run: python3 tools/fix_subpath_links.py public /cpp

      - name: Minimal output smoke check
        run: python3 tools/smoke_check.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # sanad: ref=v5.0.0
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # sanad: ref=v5.0.0
