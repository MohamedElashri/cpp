name: Deploy Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # sanad: ref=v3
        with:
          hugo-version: '0.156.0'
          extended: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # sanad: ref=v5
        with:
          python-version: '3.12'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # sanad: ref=v5

      - name: Generate reference map
        run: python3 tools/build_reference_map.py

      - name: Generate ranges index
        run: python3 tools/ranges_categorizer.py --out data/ranges_index.json

      - name: Generate algorithm index
        run: python3 tools/algorithm_categorizer.py --out data/algorithm_index.json

      - name: Generate search index
        run: python3 tools/build_search_index.py

      - name: Build site
        run: hugo --minify --baseURL "https://melashri.net/cpp/"

      - name: Fix subpath links in built HTML
        run: python3 tools/fix_subpath_links.py public /cpp

      - name: Minimal output smoke check
        run: python3 tools/smoke_check.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # sanad: ref=v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # sanad: ref=v4
